const ids=['chapter','landmarks','route','route-line','mismatch','gap-line','speed','dust','dot-shadow','dot','body','leg-left','leg-right','back-arm','eyes','pupils','brows','mouth','parcel-hand','reach-arm','reach-path','reach-hand','hat','incoming','letter-closeup','speech','shock','sweat','brake-word','narration'];
const el=Object.fromEntries(ids.map(id=>[id,$(id)]));
function attr(id,key,value){el[id].setAttribute(key,value)}
function alpha(id,value){attr(id,'opacity',clamp(value))}
function trans(id,value){attr(id,'transform',value)}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function rotatedPoint(x,y,angle){const a=angle*Math.PI/180;return{x:800+(x-800)*Math.cos(a)-(y-580)*Math.sin(a),y:580+(x-800)*Math.sin(a)+(y-580)*Math.cos(a)}}
function stateAt(time){
 const unfold=lerp(.035,1,out(progress(time,0,1.45)));
 const angle=-16*smooth(progress(time,5.2,6.4));
 const run=progress(time,4.95,5.65),stop=out(progress(time,5.65,6.12));
 const x=390+170*run*run+105*stop;
 const moving=time>4.95&&time<6.12;
 const lean=time<5.65?12*smooth(progress(time,4.95,5.5)):lerp(12,-15,smooth(progress(time,5.65,5.99)))*(1-smooth(progress(time,6.2,6.65)));
 const crouch=fade(time,7.55,8.18,8.45,9.2);
 const bob=moving?-Math.abs(Math.sin((time-4.95)*19))*12:0;
 const target=rotatedPoint(1260,610,angle);
 const baseHat={x:x+2,y:610+bob-99+38*crouch,rotation:lean*.7};
 let hat={...baseHat};
 if(time>=5.7&&time<7.6){const p=progress(time,5.7,7.6),launchX=392+170+105*out(progress(5.7,5.65,6.12)),launchY=511-Math.abs(Math.sin(.75*19))*12,launchRotation=lerp(12,-15,smooth(progress(5.7,5.65,5.99)))*.7;hat={x:lerp(launchX,850,p),y:lerp(launchY,684,p)-210*4*p*(1-p),rotation:lerp(launchRotation,375,p)}}
 else if(time>=7.6&&time<8.42){hat={x:850,y:684-7*Math.abs(Math.sin(progress(time,7.6,8)*Math.PI))* (1-progress(time,7.6,8)),rotation:15}}
 else if(time>=8.42&&time<9.35){const p=smooth(progress(time,8.42,9.35));hat={x:lerp(850,baseHat.x,p),y:lerp(684,baseHat.y,p)-90*Math.sin(p*Math.PI),rotation:lerp(15,0,p)}}
 return{t:time,unfold,angle,x,lean,crouch,bob,target,hat,moving};
}
function drawMap(s){
 const p=palettes[look];ctx.clearRect(0,0,1600,900);ctx.fillStyle=p.sky;ctx.fillRect(0,0,1600,900);
 ctx.fillStyle=p.grass;ctx.beginPath();ctx.moveTo(0,465);ctx.bezierCurveTo(300,340,450,475,700,455);ctx.bezierCurveTo(1000,390,1220,330,1600,465);ctx.lineTo(1600,900);ctx.lineTo(0,900);ctx.fill();
 ctx.save();ctx.translate(800,580);ctx.rotate(s.angle*Math.PI/180);ctx.scale(s.unfold,1);ctx.translate(-800,-580);
 ctx.fillStyle='#29475b16';roundRect(73,340,1455,417,35);ctx.fill();ctx.fillStyle=p.map;roundRect(65,325,1470,415,35);ctx.fill();ctx.strokeStyle=p.ink;ctx.lineWidth=look==='comic'?4:2.8;ctx.stroke();
 ctx.save();roundRect(65,325,1470,415,35);ctx.clip();
 ctx.fillStyle=p.block;[[325,355,210,100],[735,355,128,105],[1085,355,350,80],[320,666,270,50],[865,660,300,60],[1360,520,105,180]].forEach(r=>{roundRect(...r,18);ctx.fill()});
 ctx.strokeStyle=p.grid;ctx.lineWidth=1.8;ctx.beginPath();for(let x=100;x<1550;x+=95){ctx.moveTo(x,325);ctx.lineTo(x,740)}for(let y=345;y<740;y+=65){ctx.moveTo(65,y);ctx.lineTo(1535,y)}ctx.stroke();
 // The central street belongs to the same rigid map coordinate system.
 ctx.strokeStyle=look==='future'?'#cee4f6':'#f0e7c7';ctx.lineWidth=57;ctx.beginPath();ctx.moveTo(80,610);ctx.lineTo(1520,610);ctx.stroke();ctx.strokeStyle='#ffffffb3';ctx.lineWidth=2;ctx.setLineDash([13,17]);ctx.stroke();ctx.setLineDash([]);
 ctx.restore();ctx.restore();
}
function render(time){
 const s=stateAt(clamp(time,0,DURATION));drawMap(s);
 trans('landmarks',`translate(800 580) rotate(${s.angle}) scale(${s.unfold} 1) translate(-800 -580)`);
 alpha('chapter',1-smooth(progress(time,2.4,3.1))*.55);
 const routeShow=smooth(progress(time,3.05,3.95));alpha('route',routeShow);
 attr('route-line','pathLength',1);attr('route-line','stroke-dasharray','.0174 .0199');attr('route-line','stroke-dashoffset',0);
 // Clip the dashed line while Dot draws; no change to its screen coordinate system.
 el.route.style.clipPath=`inset(0 ${Math.max(0,(1-routeShow)*72)}% 0 0)`;
 alpha('mismatch',smooth(progress(time,6.15,6.55))*.75);
 attr('gap-line','d',`M1260 610Q1325 ${lerp(610,s.target.y,.5)} ${s.target.x} ${s.target.y}`);
 trans('dot',`translate(${s.x} ${610+s.bob+38*s.crouch}) rotate(${s.lean})`);
 const squash=fade(time,5.68,5.93,6.1,6.45);trans('body',`scale(${1+.09*squash} ${1-.08*squash}) rotate(${20*s.crouch})`);
 attr('dot-shadow','cx',s.x);attr('dot-shadow','rx',79+20*squash);attr('dot-shadow','opacity',.8);
 const walk=s.moving?Math.sin((time-4.95)*22):0;
 trans('leg-left',`rotate(${walk*23+15*squash} -34 54)`);trans('leg-right',`rotate(${-walk*23-17*squash} 31 54)`);
 alpha('speed',fade(time,5.04,5.17,5.65,5.95));trans('speed',`translate(${s.x} 605)`);
 const dustP=progress(time,5.72,6.75);alpha('dust',fade(time,5.72,5.93,6.2,6.75));trans('dust',`translate(${s.x-60-45*dustP} 683) scale(${.45+.8*dustP})`);
 alpha('brake-word',fade(time,5.72,5.85,6.38,6.62));trans('brake-word',`translate(${s.x-145} 425)`);
 const surprise=smooth(progress(time,5.65,5.9))*(1-smooth(progress(time,8.7,9.6)));
 const blink=fade(time,2.83,2.89,2.96,3.03)+fade(time,8.9,8.96,9.02,9.09);
 trans('eyes',`translate(0 ${-43*(1-(1-.92*blink))}) scale(1 ${1-.92*blink})`);
 trans('pupils',`translate(${surprise*-4} ${surprise*-2})`);
 attr('mouth','d',surprise>.4?'M22-2C12-3 10 18 23 20C36 22 39 0 22-2Z':time>9.2?'M15 3Q30-5 43 3':'M13-7Q29 13 44-9');
 attr('brows','d',surprise>.4?'M-7-79 15-84M33-83 53-77':'M-6-73 16-75M32-75 51-72');
 alpha('parcel-hand',1);alpha('reach-arm',fade(time,7.55,7.9,9.0,9.3));
 // Arm follows the resting hat, then retracts as the cap returns to the head.
 const reach=fade(time,7.55,8.1,8.45,9.3);trans('parcel-hand',`translate(${-130*reach} ${20*reach}) rotate(${-10*reach})`);
 // Inverse character transforms keep the glove attached to the cap during pickup.
 const grip=time<8.42?{x:878,y:696}:{x:s.hat.x+28,y:s.hat.y+12};
 const vx=grip.x-s.x,vy=grip.y-(610+s.bob+38*s.crouch),r=-s.lean*Math.PI/180;
 const ux=(vx*Math.cos(r)-vy*Math.sin(r))/(1+.09*squash),uy=(vx*Math.sin(r)+vy*Math.cos(r))/(1-.08*squash),br=-20*s.crouch*Math.PI/180;
 const pick=smooth(progress(time,7.55,8.1)),hx=lerp(98,ux*Math.cos(br)-uy*Math.sin(br),pick),hy=lerp(22,ux*Math.sin(br)+uy*Math.cos(br),pick);
 attr('reach-path','d',`M61 10Q${hx-10} ${hy+25} ${hx} ${hy}`);attr('reach-hand','cx',hx);attr('reach-hand','cy',hy);
 trans('hat',`translate(${s.hat.x} ${s.hat.y}) rotate(${s.hat.rotation})`);
 alpha('hat',1);
 const receive=out(progress(time,.35,1.75));alpha('incoming',1-smooth(progress(time,1.62,1.84)));trans('incoming',`translate(${lerp(255,488,receive)} ${lerp(516,614,receive)-30*Math.sin(receive*Math.PI)}) rotate(${lerp(-12,-7,receive)}) scale(.78)`);
 // Hide held envelope until receipt, retaining Dot's glove underneath.
 const held=el['parcel-hand'].querySelector('use');held.setAttribute('opacity',smooth(progress(time,1.45,1.8)));
 alpha('letter-closeup',fade(time,1.85,2.1,2.65,2.95));
 const bubble=fade(time,3.12,3.28,4.72,4.9);alpha('speech',bubble);trans('speech',`translate(731 354) scale(${lerp(.94,1,back(progress(time,3.12,3.4)))}) translate(-731 -354)`);
 alpha('shock',fade(time,5.65,5.8,6.3,6.55));trans('shock',`translate(${s.x+37} 475)`);
 alpha('sweat',fade(time,6.4,6.65,9.55,9.9));trans('sweat',`translate(${s.x-60} ${562+35*s.crouch})`);
 alpha('narration',fade(time,5.8,6.02,9.6,9.8));
 $('seek').value=String(time);$('time').value=`${time.toFixed(2).padStart(5,'0')} / 10s`;
 document.documentElement.dataset.time=time.toFixed(3);
 window.__lastFrame=s;
}
function setLook(value){look=palettes[value]?value:'sky';document.body.dataset.look=look;document.querySelectorAll('[data-look][aria-pressed]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.look===look));$('look-note').textContent=notes[look];render(t)}
function syncPlay(){ $('play').textContent=playing?'暂停':t>=DURATION?'再看一次':'播放样片';$('play').setAttribute('aria-label',playing?'暂停动画':'播放动画') }
function seek(time){t=clamp(Number(time),0,DURATION);playing=false;render(t);syncPlay()}
function toggle(){if(t>=DURATION)t=0;playing=!playing;last=performance.now();syncPlay()}
$('play').addEventListener('click',toggle);$('replay').addEventListener('click',()=>{t=0;playing=true;last=performance.now();render(t);syncPlay()});
$('seek').addEventListener('input',e=>seek(e.target.value));$('speed-select').addEventListener('change',e=>rate=Number(e.target.value));
document.querySelectorAll('.looks button').forEach(b=>b.addEventListener('click',()=>setLook(b.dataset.look)));
document.querySelectorAll('[data-time]').forEach(b=>b.addEventListener('click',()=>seek(b.dataset.time)));
document.addEventListener('keydown',e=>{if(e.target.matches('input,select,button,a'))return;if(e.code==='Space'){e.preventDefault();toggle()}if(e.code==='ArrowRight'){e.preventDefault();seek(t+1/60)}if(e.code==='ArrowLeft'){e.preventDefault();seek(t-1/60)}});
if(params.get('clean')==='1')document.body.classList.add('clean');if(params.get('paused')==='1')playing=false;
function sizeCanvas(){const dpr=Math.min(window.devicePixelRatio||1,2);cv.width=1600*dpr;cv.height=900*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);render(t)}
window.addEventListener('resize',sizeCanvas);
window.__seek=seek;window.__frameState=stateAt;window.__duration=DURATION;
setLook(look);sizeCanvas();syncPlay();window.__ready=false;
function tick(now){if(last===null){last=now;render(t);window.__ready=true;requestAnimationFrame(tick);return}if(playing){t=Math.min(DURATION,t+Math.min((now-last)/1000,.1)*rate);render(t);if(t>=DURATION){playing=false;syncPlay()}}last=now;requestAnimationFrame(tick)}
document.fonts.ready.then(()=>{last=null;requestAnimationFrame(tick)});
</script>
